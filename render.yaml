services:
  - type: web
    name: bigmart-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bigmart-db
          property: connectionString

databases:
  - name: bigmart-db
    plan: free
    databaseName: bigmart
    user: bigmart
